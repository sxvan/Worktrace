name: CI

# Builds the solution and runs the tests for every pull request and every push to main.
on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    # The app targets Windows, so it only builds there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build OpenTimesheet.slnx -c Release

      - name: Test
        run: dotnet test --project tests/Capture.Core.Tests -c Release --no-build
